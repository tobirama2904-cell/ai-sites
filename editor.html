<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Builder PRO</title>

<style>
body{
 margin:0;
 background:#0f0f0f;
 color:white;
 font-family:sans-serif;
 display:flex;
 height:100vh;
}

#left{
 width:350px;
 background:#111;
 padding:15px;
 display:flex;
 flex-direction:column;
 gap:10px;
}

#right{
 flex:1;
 background:white;
}

input, textarea{
 padding:10px;
 border:none;
 border-radius:8px;
}

button{
 padding:10px;
 border:none;
 border-radius:8px;
 background:#4f46e5;
 color:white;
 cursor:pointer;
}

#projects{
 overflow:auto;
 max-height:200px;
}

.project{
 padding:8px;
 background:#1f2937;
 margin-top:5px;
 cursor:pointer;
}
</style>
</head>

<body>

<div id="left">

<h2>🤖 AI Builder</h2>

<textarea id="prompt" placeholder="Напиши: сайт для продажи кроссовок..."></textarea>

<button onclick="generate()">🚀 Создать сайт</button>

<h3>📂 Проекты</h3>
<div id="projects"></div>

</div>

<iframe id="right"></iframe>

<script>
let projects = []

async function generate(){
 let p = prompt.value

 let r = await fetch("/create-site",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({prompt:p})
 })

 let d = await r.json()

 projects.push(d.id)
 renderProjects()

 loadSite(d.id)
}

function loadSite(id){
 right.src = "/site?id=" + id
}

function renderProjects(){
 projects.innerHTML=""
 projects.forEach(id=>{
  projects.innerHTML += `<div class="project" onclick="loadSite('${id}')">${id}</div>`
 })
}
</script>

</body>
</html>
