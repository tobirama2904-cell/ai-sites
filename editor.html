<!DOCTYPE html>
<html>
<body style="background:black;color:white;font-family:sans-serif">

<h2>AI SaaS</h2>

<input id="u" placeholder="user">
<input id="p" placeholder="pass">

<button onclick="reg()">Register</button>
<button onclick="log()">Login</button>

<hr>

<textarea id="prompt"></textarea>
<button onclick="create()">Create Site</button>

<div id="sites"></div>

<iframe id="view" style="width:100%;height:400px"></iframe>

<script>
let token=""

async function reg(){
 let r=await fetch("/register",{method:"POST",body:JSON.stringify({user:u.value,pass:p.value})})
 let d=await r.json()
 token=d.token
}

async function log(){
 let r=await fetch("/login",{method:"POST",body:JSON.stringify({user:u.value,pass:p.value})})
 let d=await r.json()
 token=d.token
 load()
}

async function create(){
 await fetch("/create-site",{method:"POST",headers:{Authorization:token},body:JSON.stringify({prompt:prompt.value})})
 load()
}

async function load(){
 let r=await fetch("/sites",{headers:{Authorization:token}})
 let d=await r.json()

 sites.innerHTML=""
 d.forEach(s=>{
  sites.innerHTML+=`<div onclick="openSite(${s.id})">${s.prompt}</div>`
 })
}

function openSite(id){
 view.src="/site/"+id
}
</script>

</body>
</html>
